<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>재롱님께, 별이 내리는 밤에</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f5efe6;
    --ink-dim: rgba(245, 239, 230, 0.55);
    --accent: #ffd9a0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #070b1e;
    font-family: 'Gowun Batang', 'Nanum Myeongjo', serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* ---------- 텍스트 오버레이 ---------- */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vh 8vw 14vh;
    cursor: pointer;
    z-index: 2;
  }
  .line {
    color: var(--ink);
    font-size: clamp(19px, 4.6vw, 27px);
    line-height: 1.9;
    letter-spacing: 0.02em;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.6s ease, transform 1.6s ease;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.45);
    max-width: 34ch;
    word-break: keep-all;
    margin: 0.35em 0;
  }
  /* nowrap: 줄바꿈 없이 한 줄로 (넘치면 JS가 글자 크기를 줄여 맞춤) */
  .line.nowrap {
    max-width: none;
    white-space: nowrap;
  }
  .line.small {
    font-size: clamp(14px, 3.4vw, 17px);
    color: var(--ink-dim);
  }
  .line.show {
    opacity: 1;
    transform: translateY(0);
  }
  /* 넘김 표시: 반짝이는 별 + 터치 리플처럼 퍼지는 물결 */
  #hint {
    position: fixed;
    left: 50%;
    bottom: max(4.5vh, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: 56px;
    height: 56px;
    z-index: 2;
    cursor: pointer;
    transition: opacity 0.8s ease;
  }
  #hint .tap-star {
    position: absolute;
    inset: 0;
    margin: auto;             /* 56px 박스 정중앙에 배치 → 확대/축소 기준점 = 별의 중심 */
    width: 20px;
    height: 20px;
    color: rgba(255, 236, 200, 0.9);
    filter: drop-shadow(0 0 6px rgba(255, 217, 160, 0.75));
    animation: starPulse 2.4s ease-in-out infinite;
  }
  #hint .tap-ripple {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(255, 236, 200, 0.5);
    border-radius: 50%;
    opacity: 0;
    animation: tapRipple 2.4s ease-out infinite;
  }
  #hint .tap-ripple.r2 { animation-delay: 1.2s; }
  /* 마우스를 올리면 별이 강하게 반짝임 */
  #hint:hover .tap-star {
    animation: starSparkle 1.8s ease-in-out infinite;
    color: rgba(255, 244, 220, 1);
    filter:
      drop-shadow(0 0 8px rgba(255, 227, 170, 0.95))
      drop-shadow(0 0 16px rgba(255, 217, 160, 0.6));
  }
  #hint:hover .tap-ripple {
    border-color: rgba(255, 236, 200, 0.85);
    animation-duration: 2s;
  }
  #hint:hover .tap-ripple.r2 { animation-delay: 1s; }
  @keyframes starSparkle {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
    50% { transform: scale(1.5) rotate(20deg); opacity: 0.8; }
  }
  @keyframes starPulse {
    0%, 100% { transform: scale(0.85); opacity: 0.55; }
    50% { transform: scale(1.15); opacity: 1; }
  }
  @keyframes tapRipple {
    0% { transform: scale(0.25); opacity: 0.65; }
    70%, 100% { transform: scale(1); opacity: 0; }
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.85; }
  }
  /* 문장이 모두 나타나기 전에는 힌트 숨김 (숨김 중엔 클릭도 통과) */
  #hint.hidden {
    animation: none;
    opacity: 0;
    pointer-events: none;
  }
  /* ---------- 마지막 선택 버튼 ---------- */
  #choices {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 5vh;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.6s ease 0.6s, transform 1.6s ease 0.6s;
    pointer-events: none;
  }
  #choices.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .choice {
    font-family: inherit;
    font-size: clamp(15px, 3.8vw, 18px);
    color: var(--ink);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(245, 239, 230, 0.35);
    border-radius: 999px;
    padding: 14px 34px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background 0.5s ease, border-color 0.5s ease, transform 0.3s ease;
    letter-spacing: 0.03em;
  }
  .choice:hover, .choice:focus-visible {
    background: rgba(255, 217, 160, 0.18);
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .choice:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  #from {
    position: fixed;
    right: 5vw;
    bottom: max(4.5vh, env(safe-area-inset-bottom));
    color: rgba(93, 64, 55, 0.85);
    font-size: 15px;
    letter-spacing: 0.1em;
    z-index: 2;
    opacity: 0;
    transition: opacity 2s ease 1s;
    pointer-events: none;
    text-shadow: 0 1px 10px rgba(255, 245, 230, 0.6);
  }
  #from.show { opacity: 1; }
  /* ---------- 시작 오버레이 ---------- */
  #intro {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: rgba(7, 11, 30, 0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 5;
    transition: opacity 1.4s ease;
  }
  #intro.hide {
    opacity: 0;
    pointer-events: none;
  }
  #intro p {
    color: var(--ink-dim);
    font-size: clamp(14px, 3.6vw, 16px);
    letter-spacing: 0.14em;
  }
  #introBtn {
    font-family: inherit;
    font-size: clamp(16px, 4.2vw, 19px);
    color: var(--ink);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(245, 239, 230, 0.4);
    border-radius: 999px;
    padding: 16px 38px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    letter-spacing: 0.04em;
    transition: background 0.5s ease, border-color 0.5s ease, transform 0.3s ease;
    animation: breathe 3.2s ease-in-out infinite;
  }
  #introBtn:hover, #introBtn:focus-visible {
    background: rgba(255, 217, 160, 0.18);
    border-color: var(--accent);
    transform: translateY(-2px);
    animation: none;
    opacity: 1;
  }
  #introBtn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    .line, #choices { transition-duration: 0.4s; }
    #hint .tap-star { animation: none; opacity: 0.85; }
    #hint .tap-ripple { animation: none; opacity: 0.25; transform: scale(0.8); }
  }
</style>
</head>
<body>

<audio id="bgm" src="Until_I_Found_You.mp3" loop preload="auto"></audio>
<canvas id="sky"></canvas>
<div id="stage" aria-live="polite"></div>
<div id="hint" class="hidden" style="display: none;" role="img" aria-label="화면을 살짝 눌러 주세요">
  <span class="tap-ripple r1"></span>
  <span class="tap-ripple r2"></span>
  <svg class="tap-star" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M12 0 C12.9 6.5 17.5 11.1 24 12 C17.5 12.9 12.9 17.5 12 24 C11.1 17.5 6.5 12.9 0 12 C6.5 11.1 11.1 6.5 12 0 Z"/>
  </svg>
</div>
<div id="from"></div>
<div id="intro">
  <button id="introBtn" type="button">🎵 별빛 아래에서 시작하기</button>
  <!-- <p>이어폰을 끼면 더 좋아요</p> -->
</div>

<script>
/* =====================================================================
   ✏️ CONFIG — 이 부분만 수정하면 나만의 페이지가 됩니다
   ===================================================================== */
const CONFIG = {
  fromName: "— oddy-망할락스",          // 보내는 사람 이름. 비워두면 표시되지 않아요. 예: "— 민준 드림"
  bgmVolume: 30,         // 🎵 배경음악 볼륨 (0~100). 0 = 무음, 100 = 최대
  bgmHighlight: {        // 🎵 "좋아요" 버튼을 누르면 곡의 하이라이트로 점프해요
    seekTo: "1:34",      //    점프할 재생 위치 ("분:초" 또는 초 단위 숫자)
    volume: 50          //    그 순간부터의 볼륨 (0~100)
  },

  timing: {              // ⏱ 문구 등장 속도 (단위: 초). 숫자를 키우면 더 천천히!
    fadeIn: 2.4,         //    문장 하나가 서서히 나타나는 데 걸리는 시간
    lineGap: 2.6,        //    한 문장이 나타난 뒤 다음 문장이 나타나기까지의 간격
    sceneFade: 1.8       //    장면이 바뀔 때 이전 문장들이 사라지는 시간
  },

  starTwinkle: {         // ✨ 배경 별 반짝임 간격 (단위: 초). 이 범위의 랜덤 간격으로 하나씩 반짝여요
    minGap: 5,           //    최소 간격
    maxGap: 10            //    최대 간격
  },

  shootingStar: {        // 🌠 별똥별 간격 (단위: 초). 이 범위의 랜덤 간격으로 하나씩 떨어져요
    minGap: 30,          //    최소 간격
    maxGap: 50           //    최대 간격
  },

  scenes: [
    {
      sky: 0,            // 0 = 깊은 밤, 1 = 새벽 꽃밭 (0.5 = 여명)
      lines: [
        "안녕하세요, 재롱님.",
        "잠깐, 이 밤하늘 좀 보고 가실래요?",
        { text: "손끝을 움직이면, 별들이 따라와요.", small: true }
      ]
    },
    {
      sky: 0,
      lines: [
        "별을 보다가 문득 그런 생각을 했어요.",
        "누군가를 알아간다는 건",
        "별자리를 잇는 일과 닮았다고요.",
        { text: "하나씩, 천천히, 서두르지 않고요.", small: true }
      ]
    },
    {
      sky: 0.55,
      lines: [
        "솔직히 말하면,",
        "재롱님이 어떤 사람인지 궁금해졌어요.",
        "어떤 계절을 좋아하는지,",
        "어떤 꽃을 좋아하는지.",
        "어떤 이야기에 웃음을 짓는지,"
      ]
    },
    {
      sky: 0.78,
      lines: [
        "신기하죠.",
        "별은 늘 그 자리에 있었는데,",
        "어느 날부터 유난히 반짝여 보이는 것처럼요.",
        { text: "재롱님 생각을 하면, 꼭 그래요.", small: true }
      ]
    },
    {
      sky: 1,
      lines: [
        "부담은 갖지 않으셨으면 해요.",
        "그냥, 서로가 어떤 사람인지",
        { text: "조금씩 알아가는 시간을 가져보면 어떨까 해요.", small: true, nowrap: true },
        { text: "차 한 잔의 속도로, 천천히요.", small: true },
        { text: "편하게 마음 가는 데로 답해주세요.", small: true }
      ],
      final: true        // 마지막 장면: 선택 버튼이 나타납니다
    }
  ],
  showChoices: false,    // 마지막 선택 버튼 표시 여부. true로 바꾸면 다시 나타나요
  choices: [
    {
      label: "좋아요, 천천히 알아가요",
      reply: ["고마워요.", "설레는 마음으로, 곧 연락드릴게요."],
      highlight: true    // 이 버튼을 누르면 bgmHighlight 연출 실행
    },
    {
      label: "조금 생각해볼게요",
      reply: ["충분히 천천히 생각하셔도 괜찮아요.", "어떤 답이든, 그대로 존중할게요."]
    }
  ],
  closing: { text: "이 밤하늘은 언제든 다시 열어볼 수 있어요.", small: true }
};

/* =====================================================================
   아래는 연출 코드입니다 (수정하지 않아도 동작해요)
   ===================================================================== */
(() => {
  "use strict";

  const canvas = document.getElementById("sky");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage");
  const hint = document.getElementById("hint");
  const fromEl = document.getElementById("from");
  const bgm = document.getElementById("bgm");

  /* ---------- 배경음악 ----------
     볼륨은 CONFIG.bgmVolume(0~100)에서 조절하세요.
     체감(로그) 보정을 거쳐 실제 출력 게인으로 변환됩니다. */
  const percentToGain = (p) => Math.pow(Math.max(0, Math.min(100, p)) / 100, 2.5);
  const parseTime = (v) => {
    if (typeof v === "number") return v;
    const parts = String(v).split(":").map(Number);
    return parts.length === 2 ? parts[0] * 60 + parts[1] : parts[0] || 0;
  };
  let audioCtx = null;
  let bgmGain = null;
  function setBgmVolume(percent) {
    const g = percentToGain(percent);
    if (bgmGain) {
      /* 급격한 볼륨 점프로 인한 '뚝' 소리를 막기 위해 0.3초에 걸쳐 변경 */
      bgmGain.gain.cancelScheduledValues(audioCtx.currentTime);
      bgmGain.gain.setValueAtTime(bgmGain.gain.value, audioCtx.currentTime);
      bgmGain.gain.linearRampToValueAtTime(g, audioCtx.currentTime + 0.3);
    } else {
      bgm.volume = g;
    }
  }
  function startBgm() {
    if (!bgm.paused) return;
    /* file://로 직접 열면 브라우저가 Web Audio 경로를 무음 처리하므로
       volume 속성을 사용. 웹서버 배포 시에만 GainNode 사용(iOS 볼륨 대응). */
    const AC = window.AudioContext || window.webkitAudioContext;
    const useWebAudio = AC && location.protocol !== "file:";
    if (useWebAudio && !audioCtx) {
      audioCtx = new AC();
      const src = audioCtx.createMediaElementSource(bgm);
      bgmGain = audioCtx.createGain();
      bgmGain.gain.value = percentToGain(CONFIG.bgmVolume);
      src.connect(bgmGain).connect(audioCtx.destination);
    } else if (!useWebAudio) {
      bgm.volume = percentToGain(CONFIG.bgmVolume);
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    bgm.play().catch(() => {});
  }
  /* "좋아요" 선택 시: 곡의 하이라이트 지점으로 점프 + 볼륨 상승 */
  function playHighlight() {
    const hl = CONFIG.bgmHighlight;
    if (!hl) return;
    bgm.currentTime = parseTime(hl.seekTo);
    setBgmVolume(hl.volume);
    if (bgm.paused) bgm.play().catch(() => {});
  }

  /* 기기 애니메이션 감소 설정(prefers-reduced-motion)이 캔버스 별빛 효과를 전부 차단하지 않도록 기본 동작 보장 */
  const reduceMotion = false;

  let W = 0, H = 0, DPR = 1;
  let stars = [];
  let flowers = [];
  let driftPetals = [];
  let sparkles = [];
  let shootingStars = [];
  let nextShootAt = 0;
  let dust = [];              /* 마지막 연출: 문구가 흩어져 만든 모래 입자 */

  const mouse = { x: -9999, y: -9999, active: false };

  /* 하늘 전환 상태: 0 = 밤, 1 = 새벽 꽃밭 */
  let skyMix = 0;
  let skyTarget = 0;

  /* ---------- 유틸 ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp01 = (v) => Math.max(0, Math.min(1, v));

  function lerpColor(c1, c2, t) {
    return [
      Math.round(lerp(c1[0], c2[0], t)),
      Math.round(lerp(c1[1], c2[1], t)),
      Math.round(lerp(c1[2], c2[2], t))
    ];
  }
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  /* ---------- 팔레트 ---------- */
  const NIGHT_TOP = [7, 11, 30];
  const NIGHT_MID = [22, 30, 68];
  const NIGHT_BOT = [42, 47, 92];
  const DAWN_TOP  = [83, 96, 168];
  const DAWN_MID  = [216, 148, 158];
  const DAWN_BOT  = [255, 205, 158];

  const PETAL_COLORS = [
    [247, 168, 196], // 분홍
    [195, 177, 225], // 라벤더
    [255, 214, 214], // 살구빛
    [250, 240, 222], // 미색
    [255, 183, 155]  // 코랄
  ];

  /* ---------- 초기화 ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars();
    buildFlowers();
  }

  function buildStars() {
    const count = Math.round((W * H) / 5200);
    stars = [];
    flashingCount = 0;  /* 별을 새로 만들면 반짝임 카운터도 초기화 */
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: rand(0.4, 1.7),
        base: rand(0.25, 0.9),
        phase: rand(0, Math.PI * 2),
        speed: rand(0.4, 1.4),
        flash: 0,               // 반짝임 밝기 (sin 곡선: 0 → 1 → 0)
        flashP: -1,             // 반짝임 진행도 (-1 = 쉬는 중, 0~1 = 진행 중)
        ox: 0, oy: 0            // 마우스 반응 오프셋
      });
    }
  }

  function buildFlowers() {
    const count = Math.max(14, Math.round(W / 46));
    flowers = [];
    for (let i = 0; i < count; i++) {
      const x = (i + rand(0.15, 0.85)) * (W / count);
      const h = rand(H * 0.10, H * 0.24);
      flowers.push({
        x,
        baseY: H + rand(2, 26),
        h,
        size: rand(9, 17),
        petals: Math.random() < 0.5 ? 5 : 6,
        color: PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)],
        phase: rand(0, Math.PI * 2),
        stiff: rand(0.7, 1.3),   // 바람에 흔들리는 정도
        bend: 0,                  // 마우스 반응 굽힘 (부드럽게 수렴)
        glow: 0                   // 마우스 근접 시 은은한 빛
      });
    }
    /* 앞줄 꽃이 뒷줄을 가리도록 키 순 정렬 */
    flowers.sort((a, b) => a.h - b.h);
  }

  /* ---------- 입력 ---------- */
  function setMouse(x, y) {
    mouse.x = x; mouse.y = y; mouse.active = true;
    /* 밤 장면: 손끝을 따라 반짝임을 흩뿌림 */
    if (skyMix < 0.6 && Math.random() < 0.35) {
      sparkles.push({
        x: x + rand(-6, 6), y: y + rand(-6, 6),
        vx: rand(-0.3, 0.3), vy: rand(-0.55, -0.1),
        life: 1, r: rand(0.6, 1.8)
      });
    }
  }
  window.addEventListener("pointermove", (e) => setMouse(e.clientX, e.clientY), { passive: true });
  window.addEventListener("pointerdown", (e) => setMouse(e.clientX, e.clientY), { passive: true });
  window.addEventListener("pointerleave", () => { mouse.active = false; mouse.x = -9999; mouse.y = -9999; });
  window.addEventListener("touchmove", (e) => {
    const t = e.touches[0];
    if (t) setMouse(t.clientX, t.clientY);
  }, { passive: true });

  /* ---------- 그리기 ---------- */
  function drawSky(t) {
    const top = lerpColor(NIGHT_TOP, DAWN_TOP, skyMix);
    const mid = lerpColor(NIGHT_MID, DAWN_MID, skyMix);
    const bot = lerpColor(NIGHT_BOT, DAWN_BOT, skyMix);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgba(top, 1));
    g.addColorStop(0.62, rgba(mid, 1));
    g.addColorStop(1, rgba(bot, 1));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 새벽: 지평선의 따스한 햇무리 */
    if (skyMix > 0.05) {
      const sunX = W * 0.5, sunY = H * 1.06;
      const rad = Math.max(W, H) * 0.85;
      const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, rad);
      sg.addColorStop(0, `rgba(255, 226, 178, ${0.55 * skyMix})`);
      sg.addColorStop(0.4, `rgba(255, 196, 160, ${0.22 * skyMix})`);
      sg.addColorStop(1, "rgba(255, 196, 160, 0)");
      ctx.fillStyle = sg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  let prevStarT = 0;
  let flashingCount = 0;      /* 동시에 반짝이는 별 수 (최대 MAX_FLASHING개) */
  const MAX_FLASHING = 1;
  /* 반짝임 간격: CONFIG.starTwinkle에서 조절 (기본 3~5초 사이 랜덤) */
  const FLASH_GAP = {
    min: CONFIG.starTwinkle?.minGap ?? 3,
    max: CONFIG.starTwinkle?.maxGap ?? 5
  };
  let nextFlashAt = -1;       /* 다음 반짝임 예약 시각 (초) */

  /* 가운데 문구 영역(여백 40px 포함) — 이 안의 별은 반짝임 대상에서 제외.
     0.5초 캐시로 장면 전환을 따라가며 매 프레임 레이아웃 측정은 피함 */
  let textZoneCache = null;
  let textZoneAt = -1;
  function textZone(t) {
    if (t - textZoneAt < 0.5) return textZoneCache;
    textZoneAt = t;
    const lines = stage.querySelectorAll(".line");
    if (!lines.length) { textZoneCache = null; return null; }
    let l = Infinity, tp = Infinity, r = -Infinity, b = -Infinity;
    lines.forEach((el) => {
      const rc = el.getBoundingClientRect();
      if (rc.left < l) l = rc.left;
      if (rc.top < tp) tp = rc.top;
      if (rc.right > r) r = rc.right;
      if (rc.bottom > b) b = rc.bottom;
    });
    const pad = 40;
    textZoneCache = { l: l - pad, t: tp - pad, r: r + pad, b: b + pad };
    return textZoneCache;
  }
  function inTextZone(s, z) {
    return z && s.x > z.l && s.x < z.r && s.y > z.t && s.y < z.b;
  }

  function drawStars(t) {
    const fade = 1 - skyMix * 0.92;
    const dt = Math.min(0.1, Math.max(0.001, t - prevStarT));
    prevStarT = t;
    if (fade <= 0.02) return;

    /* 배경 별 반짝임: CONFIG.starTwinkle 간격(기본 3~5초) 사이 랜덤 주기로 하나씩 — 동시 최대 2개 */
    if (nextFlashAt < 0) nextFlashAt = t + rand(FLASH_GAP.min, FLASH_GAP.max);
    if (stars.length && t >= nextFlashAt) {
      if (flashingCount < MAX_FLASHING) {
        /* 문구 영역 밖의 별이 나올 때까지 몇 번 다시 뽑기 */
        const zone = textZone(t);
        for (let tries = 0; tries < 15; tries++) {
          const pick = stars[Math.floor(Math.random() * stars.length)];
          if (pick.flashP >= 0 || inTextZone(pick, zone)) continue;
          pick.flashP = 0;
          flashingCount++;
          break;
        }
      }
      nextFlashAt = t + rand(FLASH_GAP.min, FLASH_GAP.max);
    }

    for (const s of stars) {
      const tw = 0.62 + 0.38 * Math.sin(t * s.speed + s.phase);
      let a = s.base * tw * fade;
      let r = s.r;

      /* 반짝임: 약 2.6초에 걸쳐 서서히 밝아졌다가 서서히 원래 밝기로 (sin 곡선) */
      if (s.flashP >= 0) {
        s.flashP += dt / 2.6;
        if (s.flashP >= 1) {
          s.flashP = -1;
          s.flash = 0;
          flashingCount = Math.max(0, flashingCount - 1);
        } else {
          s.flash = Math.sin(s.flashP * Math.PI);
        }
        a = Math.min(1, a + s.flash * 0.8 * fade);
        r += s.flash * 1.2;
      }

      /* 마우스 근접 → 살짝 다가오고, 주변 별 중 일부만 이따금 반짝 */
      const dx = mouse.x - (s.x + s.ox);
      const dy = mouse.y - (s.y + s.oy);
      const d2 = dx * dx + dy * dy;
      const R = 150;
      let tx = 0, ty = 0;
      if (mouse.active && d2 < R * R) {
        const d = Math.sqrt(d2) || 1;
        const k = 1 - d / R;
        a = Math.min(1, a + k * 0.25);
        r = Math.max(r, s.r + k * 0.6);
        tx = (dx / d) * k * 14;
        ty = (dy / d) * k * 14;
        /* 가까울수록 조금 더 자주 — 동시 개수 제한과 문구 영역 제외는 동일하게 적용 */
        if (s.flashP < 0 && flashingCount < MAX_FLASHING &&
            Math.random() < dt * 0.08 * (0.3 + k) && !inTextZone(s, textZone(t))) {
          s.flashP = 0;
          flashingCount++;
        }
      }
      s.ox += (tx - s.ox) * 0.06;
      s.oy += (ty - s.oy) * 0.06;

      const x = s.x + s.ox, y = s.y + s.oy;

      /* 반짝임 광채: 후광 (최대 반경 12px, 중심 밝기 0.5) + 십자 빛줄기 */
      if (s.flash > 0.005) {
        const glow = s.flash * fade;
        const gr = 3 + s.flash * 9; // 3 + 9 = 최대 12px
        const gg = ctx.createRadialGradient(x, y, 0, x, y, gr);
        gg.addColorStop(0, `rgba(255, 252, 240, ${(glow * 0.5).toFixed(3)})`);
        gg.addColorStop(1, "rgba(255, 252, 240, 0)");
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.arc(x, y, gr, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = `rgba(255, 252, 240, ${(glow * 0.65).toFixed(3)})`;
        ctx.lineWidth = 1;
        const FL = 4 + s.flash * 8;
        ctx.beginPath();
        ctx.moveTo(x - FL, y); ctx.lineTo(x + FL, y);
        ctx.moveTo(x, y - FL); ctx.lineTo(x, y + FL);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 248, 231, ${a.toFixed(3)})`;
      ctx.fill();

      /* 큰 별에는 십자 광채 */
      if (r > 1.9 && a > 0.5) {
        ctx.strokeStyle = `rgba(255, 248, 231, ${(a * 0.35).toFixed(3)})`;
        ctx.lineWidth = 0.7;
        const L = r * 3.4;
        ctx.beginPath();
        ctx.moveTo(x - L, y); ctx.lineTo(x + L, y);
        ctx.moveTo(x, y - L); ctx.lineTo(x, y + L);
        ctx.stroke();
      }
    }
  }

  /* 별똥별 간격: CONFIG.shootingStar에서 조절 (기본 10~30초 사이 랜덤) */
  const SHOOT_GAP = {
    min: CONFIG.shootingStar?.minGap ?? 10,
    max: CONFIG.shootingStar?.maxGap ?? 30
  };

  function spawnShootingStar(t) {
    shootingStars.push({
      x: rand(W * 0.15, W * 0.85),
      y: rand(H * 0.05, H * 0.35),
      /* 별똥별마다 속도·각도·수명이 미세하게 달라 실제처럼 보이도록 */
      vx: -rand(2.1, 4.3),
      vy: rand(0.9, 1.8),
      fade: rand(0.007, 0.013),   /* 수명 감소 속도 → 이동 거리도 별마다 달라짐 */
      life: 1,
      maxLife: 1
    });
    nextShootAt = t + rand(SHOOT_GAP.min, SHOOT_GAP.max);
  }

  function drawShootingStars(t) {
    if (skyMix > 0.85) return;
    if (t > nextShootAt) spawnShootingStar(t);

    const skyFade = Math.max(0, 1 - skyMix * 0.7);

    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      s.x += s.vx; s.y += s.vy; s.life -= (s.fade || 0.010);
      if (s.life <= 0) { shootingStars.splice(i, 1); continue; }

      const lifeRatio = s.life / (s.maxLife || 1);
      const opacity = Math.sin(lifeRatio * Math.PI) * skyFade;

      const tail = 24;
      const tailX = s.x - s.vx * tail;
      const tailY = s.y - s.vy * tail;

      /* 은은한 외곽 빛선 */
      const gOuter = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
      gOuter.addColorStop(0, `rgba(255, 235, 190, ${(0.55 * opacity).toFixed(3)})`);
      gOuter.addColorStop(1, "rgba(255, 235, 190, 0)");
      ctx.strokeStyle = gOuter;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();

      /* 또렷한 핵심 꼬리선 */
      const gCore = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
      gCore.addColorStop(0, `rgba(255, 255, 250, ${(0.95 * opacity).toFixed(3)})`);
      gCore.addColorStop(1, "rgba(255, 255, 250, 0)");
      ctx.strokeStyle = gCore;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();

      /* 반짝이는 별똥별 머리 점 */
      const headGlow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 6);
      headGlow.addColorStop(0, `rgba(255, 255, 255, ${(1.0 * opacity).toFixed(3)})`);
      headGlow.addColorStop(0.5, `rgba(255, 236, 190, ${(0.6 * opacity).toFixed(3)})`);
      headGlow.addColorStop(1, "rgba(255, 236, 190, 0)");
      ctx.fillStyle = headGlow;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawSparkles() {
    for (let i = sparkles.length - 1; i >= 0; i--) {
      const p = sparkles[i];
      p.x += p.vx; p.y += p.vy; p.life -= 0.02;
      if (p.life <= 0) { sparkles.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 234, 190, ${0.8 * p.life})`;
      ctx.fill();
    }
  }

  /* 바람: 위치와 시간에 따른 부드러운 파동 */
  function wind(t, x) {
    if (reduceMotion) return 0;
    return Math.sin(t * 0.9 + x * 0.006) * 0.075
         + Math.sin(t * 0.33 + x * 0.013) * 0.05;
  }

  function drawFlower(f, t) {
    const sway = wind(t, f.x) * f.stiff + f.bend;
    const tipX = f.x + Math.sin(sway) * f.h * 0.55;
    const tipY = f.baseY - f.h;
    const ctrlX = f.x + Math.sin(sway) * f.h * 0.18;
    const ctrlY = f.baseY - f.h * 0.55;

    /* 줄기 */
    ctx.strokeStyle = `rgba(96, 128, 96, ${0.9 * skyMix})`;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(f.x, f.baseY);
    ctx.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY);
    ctx.stroke();

    /* 잎사귀 */
    ctx.fillStyle = `rgba(110, 148, 108, ${0.75 * skyMix})`;
    const leafY = f.baseY - f.h * 0.4;
    const leafX = f.x + Math.sin(sway) * f.h * 0.1;
    ctx.save();
    ctx.translate(leafX, leafY);
    ctx.rotate(sway * 0.6 - 0.7);
    ctx.beginPath();
    ctx.ellipse(f.size * 0.55, 0, f.size * 0.62, f.size * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    /* 꽃송이: 마우스가 가까우면 은은하게 빛남 */
    if (f.glow > 0.02) {
      const gg = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, f.size * 3.2);
      gg.addColorStop(0, rgba(f.color, 0.35 * f.glow * skyMix));
      gg.addColorStop(1, rgba(f.color, 0));
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(tipX, tipY, f.size * 3.2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(tipX, tipY);
    ctx.rotate(sway * 0.5 + (reduceMotion ? 0 : Math.sin(t * 0.5 + f.phase) * 0.05));
    const pr = f.size * (1 + f.glow * 0.12);
    for (let i = 0; i < f.petals; i++) {
      const ang = (i / f.petals) * Math.PI * 2;
      ctx.save();
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.ellipse(pr * 0.62, 0, pr * 0.66, pr * 0.34, 0, 0, Math.PI * 2);
      ctx.fillStyle = rgba(f.color, (0.88 + f.glow * 0.12) * skyMix);
      ctx.fill();
      ctx.restore();
    }
    /* 꽃술 */
    ctx.beginPath();
    ctx.arc(0, 0, pr * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 219, 140, ${0.95 * skyMix})`;
    ctx.fill();
    ctx.restore();
  }

  function updateFlowers(t) {
    if (skyMix < 0.03) return;
    for (const f of flowers) {
      /* 마우스가 꽃 근처를 지나면 살짝 물러나며 반짝임 */
      const tipY = f.baseY - f.h;
      const dx = (f.x - mouse.x);
      const dy = (tipY - mouse.y);
      const d2 = dx * dx + dy * dy;
      const R = 130;
      let targetBend = 0, targetGlow = 0;
      if (mouse.active && d2 < R * R) {
        const d = Math.sqrt(d2) || 1;
        const k = 1 - d / R;
        targetBend = (dx >= 0 ? 1 : -1) * k * 0.45;
        targetGlow = k;
        if (!reduceMotion && Math.random() < k * 0.12) {
          driftPetals.push({
            x: f.x + rand(-8, 8), y: tipY + rand(-8, 4),
            vx: rand(0.15, 0.6), vy: rand(-0.35, -0.05),
            rot: rand(0, Math.PI * 2), vr: rand(-0.03, 0.03),
            color: f.color, life: 1, size: rand(2.4, 4.2)
          });
        }
      }
      f.bend += (targetBend - f.bend) * 0.07;
      f.glow += (targetGlow - f.glow) * 0.08;
      drawFlower(f, t);
    }
  }

  /* 바람에 실려 떠다니는 꽃잎 */
  function drawDriftPetals(t) {
    if (skyMix < 0.03) return;
    /* 은은하게 배경에서 계속 흩날리는 꽃잎 */
    if (!reduceMotion && driftPetals.length < 26 && Math.random() < 0.05 * skyMix) {
      driftPetals.push({
        x: rand(-30, W * 0.4), y: rand(H * 0.2, H * 0.85),
        vx: rand(0.25, 0.7), vy: rand(-0.12, 0.18),
        rot: rand(0, Math.PI * 2), vr: rand(-0.02, 0.02),
        color: PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)],
        life: 1, size: rand(2.2, 4.4)
      });
    }
    for (let i = driftPetals.length - 1; i >= 0; i--) {
      const p = driftPetals[i];
      p.x += p.vx + Math.sin(t + p.rot) * 0.18;
      p.y += p.vy + Math.cos(t * 0.7 + p.rot) * 0.1;
      p.rot += p.vr;
      p.life -= 0.0035;
      if (p.life <= 0 || p.x > W + 40) { driftPetals.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
      ctx.fillStyle = rgba(p.color, 0.55 * p.life * skyMix);
      ctx.fill();
      ctx.restore();
    }
  }

  /* ---------- 문구 흩날림 (바람에 날리는 모래처럼) ---------- */
  let dispersed = false;

  function disperseText() {
    if (dispersed) return;
    dispersed = true;

    const els = [...stage.querySelectorAll(".line"), fromEl].filter(
      (el) => el && el.textContent
    );

    /* 화면과 같은 크기의 오프스크린 캔버스에 문구를 같은 위치·폰트로 그려 픽셀 추출 */
    const off = document.createElement("canvas");
    off.width = W;
    off.height = H;
    const octx = off.getContext("2d");
    octx.textAlign = "center";
    octx.textBaseline = "middle";

    els.forEach((el) => {
      const cs = getComputedStyle(el);
      const rect = el.getBoundingClientRect();
      octx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      octx.fillStyle = cs.color;
      const lineH = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.6;
      /* 좁은 화면에서 줄바꿈된 문장도 원래 배치대로: 간단한 워드랩 */
      const words = el.textContent.split(" ");
      const rows = [];
      let cur = "";
      words.forEach((wd) => {
        const test = cur ? cur + " " + wd : wd;
        if (cur && octx.measureText(test).width > rect.width + 2) {
          rows.push(cur);
          cur = wd;
        } else {
          cur = test;
        }
      });
      if (cur) rows.push(cur);
      const cx0 = rect.left + rect.width / 2;
      const y0 = rect.top + rect.height / 2 - ((rows.length - 1) * lineH) / 2;
      rows.forEach((row, ri) => octx.fillText(row, cx0, y0 + ri * lineH));
    });

    /* 글자 픽셀 → 모래 입자 */
    const img = octx.getImageData(0, 0, W, H).data;
    const step = 3;
    for (let py = 0; py < H; py += step) {
      for (let px = 0; px < W; px += step) {
        const i = (py * W + px) * 4;
        if (img[i + 3] > 90) {
          dust.push({
            x: px, y: py,
            vx: 0, vy: 0,
            rgb: `${img[i]},${img[i + 1]},${img[i + 2]}`,
            a: img[i + 3] / 255,
            life: 1,
            decay: rand(0.22, 0.45),          /* 초당 소멸 속도 → 약 2~4.5초 생존 */
            size: rand(1, 1.9),
            sway: rand(0, Math.PI * 2),
            age: 0,
            appearAt: rand(0, 1.6),           /* 알갱이마다 무작위 순서로 서서히 맺힘 */
            windAt: 2.8 + (px / W) * 1.6 + rand(0, 0.5)  /* 다 맺힌 뒤, 왼쪽부터 바람 */
          });
        }
      }
    }

    /* DOM 문구는 입자가 맺히는 동안 천천히 옅어지며 교체 (크로스페이드) */
    els.forEach((el) => {
      el.style.transition = "opacity 2.6s ease";
      el.style.opacity = "0";
    });
  }

  let prevDustT = 0;
  function drawDust(t) {
    const dt = Math.min(0.05, Math.max(0.001, t - prevDustT));
    prevDustT = t;
    if (!dust.length) return;
    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i];
      p.age += dt;
      if (p.age < p.windAt) {
        /* 1단계: 글자가 옅어지는 동안 알갱이가 0.9초에 걸쳐 서서히 맺힘 */
        const appear = Math.min(1, Math.max(0, (p.age - p.appearAt) / 0.9));
        if (appear > 0) {
          ctx.fillStyle = `rgba(${p.rgb},${(p.a * appear).toFixed(3)})`;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        continue;
      }
      /* 바람: 꽃잎과 같은 방향(오른쪽)으로, 흔들리며 떠올라 흩어짐 */
      p.vx += (30 + Math.sin(t * 0.9 + p.sway) * 16) * dt;
      p.vy += (Math.sin(t * 1.5 + p.sway) * 14 - 7) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0 || p.x > W + 30) { dust.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(${p.rgb},${(p.a * p.life).toFixed(3)})`;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
  }

  /* ---------- 루프 ---------- */
  let start = performance.now();
  function frame(now) {
    const t = (now - start) / 1000;
    skyMix += (skyTarget - skyMix) * (reduceMotion ? 0.06 : 0.012);
    skyMix = clamp01(skyMix);

    ctx.clearRect(0, 0, W, H);
    drawSky(t);
    drawStars(t);
    drawShootingStars(t);
    drawSparkles();
    drawDriftPetals(t);
    updateFlowers(t);
    drawDust(t);

    requestAnimationFrame(frame);
  }

  /* =====================================================================
     장면 진행 (텍스트)
     ===================================================================== */
  let sceneIndex = -1;
  let advancing = false;
  let finished = false;

  /* CONFIG.timing(초)을 ms로 변환. 기기의 '애니메이션 줄이기' 설정과
     무관하게 항상 설정값 그대로 동작하도록 고정 */
  const T = {
    fadeIn: (CONFIG.timing?.fadeIn ?? 1.6) * 1000,
    lineGap: (CONFIG.timing?.lineGap ?? 1.4) * 1000,
    sceneFade: (CONFIG.timing?.sceneFade ?? 1.4) * 1000
  };

  /* 서명을 마지막 문구(또는 선택 버튼) 아래 일정 간격에 배치.
     오른쪽 끝은 문장 블록의 오른쪽 가장자리에 맞춰 편지 서명처럼 보이게.
     화면 밖으로 나가면 기존 우측 하단 고정으로 폴백 */
  function positionFromBelowLines() {
    const last = stage.lastElementChild;
    if (!last) return;
    const top = last.getBoundingClientRect().bottom + 36;
    if (top > window.innerHeight - 40) {
      fromEl.style.top = "";
      fromEl.style.right = "";
      fromEl.style.bottom = "";
      return;
    }
    let rightEdge = 0;
    stage.querySelectorAll(".line").forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.right > rightEdge) rightEdge = r.right;
    });
    fromEl.style.top = top + "px";
    fromEl.style.bottom = "auto";
    fromEl.style.right = Math.max(24, window.innerWidth - rightEdge) + "px";
  }

  /* 힌트를 마지막 문장 아래 일정 간격에 배치 (화면 밖으로 나가면 하단 고정으로 폴백) */
  function positionHintBelowLines() {
    const lines = stage.querySelectorAll(".line");
    const last = lines[lines.length - 1];
    if (!last) return;
    /* 아이콘 박스(56px) 안 별이 중앙에 있으므로, 별 중심이 문장 아래 ~48px에 오도록 */
    const top = last.getBoundingClientRect().bottom + 20;
    if (top > window.innerHeight - 64) {
      hint.style.top = "";
      hint.style.bottom = "";
    } else {
      hint.style.top = top + "px";
      hint.style.bottom = "auto";
    }
  }
  window.addEventListener("resize", () => {
    if (!hint.classList.contains("hidden")) positionHintBelowLines();
    if (fromEl.classList.contains("show")) positionFromBelowLines();
  });

  /* nowrap 문장이 화면보다 넓으면 글자 크기를 줄여 한 줄 유지 */
  function fitNowrapLines() {
    const avail = window.innerWidth * 0.9;
    stage.querySelectorAll(".line.nowrap").forEach((el) => {
      el.style.fontSize = "";
      const w = el.scrollWidth;
      if (w > avail) {
        const cur = parseFloat(getComputedStyle(el).fontSize);
        el.style.fontSize = Math.max(12, cur * avail / w).toFixed(1) + "px";
      }
    });
  }
  window.addEventListener("resize", fitNowrapLines);

  function makeLine(item) {
    const div = document.createElement("div");
    /* 주의: 문자열에도 내장 String.prototype.small이 있어 item.small이 항상 참이 됨.
       그동안 일반 문자열 문장이 전부 small로 렌더링되어 온 것이 현재의 화면 톤이므로,
       그 모습을 유지하기 위해 문자열은 의도적으로 small 취급한다. */
    const isSmall = typeof item === "string" ? true : !!item.small;
    const isNowrap = typeof item === "object" && !!item.nowrap;
    div.className = "line" + (isSmall ? " small" : "") + (isNowrap ? " nowrap" : "");
    div.textContent = typeof item === "string" ? item : item.text;
    div.style.transitionDuration = T.fadeIn + "ms";
    return div;
  }

  function showScene(idx) {
    const scene = CONFIG.scenes[idx];
    if (!scene) return;
    advancing = true;
    skyTarget = scene.sky;
    hint.classList.add("hidden");

    /* 이전 문장 서서히 사라짐 */
    [...stage.children].forEach((el) => el.classList.remove("show"));
    setTimeout(() => {
      stage.innerHTML = "";
      const els = scene.lines.map(makeLine);
      els.forEach((el) => stage.appendChild(el));
      fitNowrapLines();

      let choicesEl = null;
      if (scene.final && CONFIG.showChoices) {
        choicesEl = document.createElement("div");
        choicesEl.id = "choices";
        CONFIG.choices.forEach((c) => {
          const btn = document.createElement("button");
          btn.className = "choice";
          btn.type = "button";
          btn.textContent = c.label;
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (c.highlight) playHighlight();
            showReply(c.reply);
          });
          choicesEl.appendChild(btn);
        });
        stage.appendChild(choicesEl);
      }

      /* 한 줄씩 시간차로 등장 */
      els.forEach((el, i) => {
        setTimeout(() => el.classList.add("show"), 300 + i * T.lineGap);
      });
      const doneAt = 300 + els.length * T.lineGap + 400;
      setTimeout(() => {
        advancing = false;
        if (scene.final) {
          /* 마지막 장면: 힌트는 계속 숨김 */
          if (choicesEl) choicesEl.classList.add("show");
          if (CONFIG.fromName) {
            fromEl.textContent = CONFIG.fromName;
            positionFromBelowLines();
            fromEl.classList.add("show");
          }
          /* 서명까지 다 보이고 잠시 여운 뒤, 문구들이 모래처럼 흩어짐 */
          if (!CONFIG.showChoices) {
            setTimeout(disperseText, 9000);
          }
        } else {
          /* 모든 문장이 나타난 뒤, 마지막 문장 아래에 힌트 표시 */
          positionHintBelowLines();
          hint.classList.remove("hidden");
        }
      }, doneAt);
    }, sceneIndex === 0 && idx === 0 ? 0 : T.sceneFade);
  }

  function showReply(lines) {
    finished = true;
    [...stage.children].forEach((el) => el.classList.remove("show"));
    setTimeout(() => {
      stage.innerHTML = "";
      const all = [...lines, CONFIG.closing];
      const els = all.map(makeLine);
      els.forEach((el) => stage.appendChild(el));
      fitNowrapLines();
      els.forEach((el, i) => {
        setTimeout(() => el.classList.add("show"), 300 + i * T.lineGap);
      });
    }, T.sceneFade);
  }

  function advance() {
    if (advancing || finished) return;
    const next = sceneIndex + 1;
    if (next >= CONFIG.scenes.length) return;
    sceneIndex = next;
    if (CONFIG.scenes[sceneIndex] && CONFIG.scenes[sceneIndex].final) {
      /* 마지막 장면 도달: 힌트 숨김은 showScene에서 처리 */
    }
    showScene(sceneIndex);
  }

  stage.addEventListener("click", advance);
  hint.addEventListener("click", advance); /* 별 아이콘을 눌러도 다음으로 */
  window.addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") advance();
  });

  /* ---------- 시작 ---------- */
  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);

  /* 시작 버튼: 음악과 함께 첫 장면을 엽니다 */
  const intro = document.getElementById("intro");
  const introBtn = document.getElementById("introBtn");
  introBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    startBgm();
    intro.classList.add("hide");
    hint.style.display = "";
    /* 시작 버튼 클릭 후 ~1.5초 뒤 첫 별똥별이 떨어지도록 타이머 설정 */
    const currentT = (performance.now() - start) / 1000;
    nextShootAt = currentT + rand(1.2, 2.2);
    setTimeout(advance, 600);
  }, { once: true });
})();
</script>
</body>
</html>
